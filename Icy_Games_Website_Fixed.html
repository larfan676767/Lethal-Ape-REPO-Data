  <title>Icy — VR Game Developer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808; --ink: #f6f6f7; --soft: #c0c0c5; --muted: #92929a;
      --accent: #ededee; --accent-ink: #111114;
      --line: rgba(255,255,255,.15); --line-strong: rgba(255,255,255,.28);
      --panel: rgba(18,18,22,.78); --panel-highlight: rgba(37,37,43,.66);
      --radius: 16px; --max: 980px; --blur: 17px;
      --heading-font: Consolas, monospace;
      --body-font: "Segoe UI", Inter, system-ui, sans-serif;
      --video-opacity: .36; --image-opacity: .82; --overlay-opacity: .24;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{isolation:isolate;margin:0;min-width:320px;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--body-font);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer}
    img{max-width:100%}
    h1,h2,h3,p{margin-top:0}
    ::selection{background:var(--accent);color:var(--accent-ink)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .hidden,[hidden]{display:none!important}

    /* Atmosphere / media background */
    .backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 14%,rgba(100,100,115,.19),transparent 46%),radial-gradient(ellipse at 0 100%,rgba(60,60,69,.12),transparent 46%),var(--bg)}
    .backdrop video,.backdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.05) brightness(.94)}
    .backdrop video{opacity:var(--video-opacity)}
    .backdrop img{opacity:var(--image-opacity)}
    .backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,var(--overlay-opacity)) 0%,rgba(0,0,0,.18) 32%,rgba(0,0,0,.54) 75%,var(--bg) 100%)}
    .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.085;background-image:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(255,255,255,.07) 4px)}

    #announcement-root{position:relative;z-index:6}

    /* Navigation */
    .announcement{position:relative;z-index:7;text-align:center;font:600 11px/1.5 var(--heading-font);padding:10px 18px;background:var(--accent);color:var(--accent-ink)}
    .announcement a{text-decoration:underline;text-underline-offset:3px}
    .site-header{position:relative;z-index:5;width:min(calc(100% - 48px),1160px);margin:0 auto;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .wordmark{font:700 13px/1 var(--heading-font);letter-spacing:-.4px;white-space:nowrap}
    .wordmark span{color:var(--muted)}
    .site-nav{display:flex;align-items:center;gap:26px}
    .site-nav a{font-size:12px;font-weight:650;color:var(--soft);transition:color .2s ease,background .2s ease}
    .site-nav a:hover{color:var(--ink)}
    .site-nav .nav-outline{border:1px solid var(--line-strong);border-radius:9px;padding:7px 13px;color:var(--ink);background:rgba(255,255,255,.035)}
    .site-nav .nav-outline:hover{background:rgba(255,255,255,.1)}
    .page{position:relative;z-index:2;width:min(calc(100% - 38px),var(--max));margin:0 auto}

    /* Hero */
    .hero{min-height:min(830px,calc(100svh - 80px));padding:80px 0 72px;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .hero.align-left{align-items:flex-start}
    .profile{position:relative;text-align:center;width:min(100%,580px);padding:43px 40px 32px;border-radius:19px;border:1px solid var(--line-strong);background:linear-gradient(135deg,var(--panel-highlight),rgba(9,9,11,.55) 35%,var(--panel));box-shadow:0 18px 100px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.055);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
    .profile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 43px rgba(255,255,255,.045)}
    .hero.align-left .profile{text-align:left}
    .profile.minimal{border-color:transparent;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
    .profile.minimal::before{display:none}
    .avatar{position:relative;display:inline-grid;place-items:center;width:109px;height:109px;border-radius:36%;border:2px solid var(--line-strong);padding:4px;background:rgba(255,255,255,.05);box-shadow:0 0 26px rgba(255,255,255,.08);overflow:hidden;font:600 44px/1 var(--heading-font)}
    .avatar.circle,.avatar.circle img{border-radius:50%}
    .avatar.square,.avatar.square img{border-radius:8px}
    .avatar img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:cover;border-radius:31%}
    .profile h1{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px;margin:22px 0 1px;font:700 clamp(30px,5vw,39px)/1.15 var(--heading-font);letter-spacing:-1.4px;text-shadow:0 0 20px rgba(255,255,255,.20);overflow-wrap:anywhere}
    .hero.align-left .profile h1,.hero.align-left .socials,.hero.align-left .location,.hero.align-left .stats{justify-content:flex-start}
    .premium{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--accent)}
    .premium svg{width:20px;height:20px;filter:drop-shadow(0 0 5px rgba(255,255,255,.3))}
    .handle{font:400 12px/1.7 var(--heading-font);letter-spacing:.2px;color:var(--muted)}
    .profile-line{margin:26px auto 0;max-width:450px;color:var(--ink);font-size:14px;font-weight:500;white-space:pre-line}
    .location{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;color:var(--soft);font-size:12px}
    .location svg{width:14px;height:14px}
    .profile-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);margin:27px 0 25px}
    .socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .social{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:43px;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.075);color:var(--ink);font-size:12px;font-weight:650;transition:background .2s ease,border-color .2s ease,transform .2s ease}
    .social:hover{background:rgba(255,255,255,.16);border-color:var(--line-strong);transform:translateY(-2px)}
    .social.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .social.primary:hover{filter:brightness(1.1)}
    .social svg{width:17px;height:17px;flex:none}
    .external-arrow{font-size:14px;line-height:1}
    .stats{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:23px}
    .stat{min-width:90px;text-align:center}
    .hero.align-left .stat{text-align:left}
    .stat b{display:block;font:700 20px/1.3 var(--heading-font)}
    .stat span{display:block;color:var(--muted);font-size:10px}
    .hero-scroll{display:inline-flex;flex-direction:column;align-items:center;gap:5px;margin-top:34px;color:var(--muted);font:500 11px/1.4 var(--heading-font);transition:color .2s,transform .2s}
    .hero-scroll:hover{color:var(--ink);transform:translateY(3px)}
    .hero-scroll svg{width:19px;height:19px}

    /* Sections */
    .section{padding:45px 0 68px;scroll-margin-top:40px}
    .section-title{display:flex;align-items:center;gap:18px;margin-bottom:24px}
    .section-title h2{margin:0;font:700 clamp(22px,3.4vw,31px)/1.2 var(--heading-font);letter-spacing:-.75px}
    .section-title::after{content:"";height:1px;background:var(--line);flex:1}
    .panel{border:1px solid var(--line);background:linear-gradient(135deg,var(--panel-highlight),var(--panel));border-radius:var(--radius);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:0 16px 56px rgba(0,0,0,.12)}
    .about-main{padding:34px 36px 32px}
    .eyebrow{color:var(--muted);font:700 10px/1.4 var(--heading-font);letter-spacing:1.9px;text-transform:uppercase}
    .about-main h3{margin:12px 0 16px;font:700 21px/1.4 var(--heading-font);letter-spacing:-.5px}
    .about-main p{white-space:pre-line;color:var(--soft);font-size:14px;line-height:1.85;max-width:800px;margin-bottom:14px}
    .about-main p:last-of-type{margin-bottom:0}
    .about-main strong{color:var(--ink);font-weight:650}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:27px}
    .tag{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--ink);font:500 11px/1.3 var(--heading-font)}
    .tag-dot{height:5px;width:5px;border-radius:50%;background:var(--accent)}
    .focus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:13px}
    .focus-card{padding:22px 24px}
    .focus-card h3{margin:0 0 8px;font:700 13px/1.4 var(--heading-font)}
    .focus-card p{margin:0;color:var(--soft);font-size:12px;line-height:1.75}
    .stack-grid{display:grid;grid-template-columns:repeat(var(--stack-cols,4),minmax(0,1fr));gap:12px}
    .stack{min-height:133px;padding:22px 19px}
    .stack h3{margin:0 0 18px;color:var(--soft);font:650 11px/1.4 var(--heading-font)}
    .stack .tags{margin:0;gap:7px}
    .stack .tag{padding:6px 9px;font-size:10px}

    /* Projects */
    .projects-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .project{position:relative;display:block;overflow:hidden;min-height:320px;border:1px solid var(--line-strong);border-radius:var(--radius);background:radial-gradient(ellipse at 67% 17%,rgba(155,155,172,.15),transparent 47%),linear-gradient(145deg,#25252b,#111113);isolation:isolate;transition:border-color .2s ease,transform .2s ease}
    .project.featured{grid-column:1/-1;min-height:360px}
    .project-cover{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;filter:saturate(.75);transition:transform .6s ease,filter .4s ease}
    .project::after{position:absolute;inset:0;z-index:-1;content:"";background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.18) 30%,rgba(0,0,0,.88) 100%)}
    .project:hover{border-color:var(--accent);transform:translateY(-3px)}
    .project:hover .project-cover{transform:scale(1.04);filter:saturate(.95)}
    .project-watermark{position:absolute;z-index:-1;top:52%;left:53%;transform:translate(-50%,-50%) rotate(-8deg);font:900 clamp(70px,13vw,170px)/.75 var(--heading-font);letter-spacing:-10px;color:rgba(255,255,255,.055);white-space:nowrap;pointer-events:none}
    .project-inner{display:flex;min-height:320px;flex-direction:column;justify-content:space-between;padding:27px 29px}
    .project.featured .project-inner{min-height:360px}
    .project .tags{margin:0}
    .project .tag{background:rgba(12,12,15,.53);border-color:rgba(255,255,255,.24);color:#f1f1f2;backdrop-filter:blur(8px)}
    .project-bottom{display:flex;justify-content:space-between;gap:20px;align-items:end}
    .project h3{font:700 clamp(25px,4vw,35px)/1.2 var(--heading-font);letter-spacing:-1px;margin:0 0 5px}
    .project p{color:#dddddf;font-size:13px;margin:0}
    .project-arrow{flex:none;width:45px;height:45px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.38);border-radius:50%;background:rgba(255,255,255,.09)}
    .project-arrow svg{width:21px;height:21px}

    /* Footer / controls */
    .site-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 0;padding:28px 0 45px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    .site-footer a{color:var(--soft)}
    .site-footer a:hover{color:var(--ink)}
    .footer-right{display:flex;gap:17px;flex-wrap:wrap}
    .motion-toggle{position:fixed;right:21px;bottom:21px;z-index:10;width:38px;height:38px;display:grid;place-items:center;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(var(--blur));transition:background .2s}
    .motion-toggle:hover{background:var(--panel-highlight)}
    .motion-toggle svg{width:17px;height:17px}
    .motion-toggle .play-icon{display:none}
    .motion-toggle.paused .play-icon{display:block}
    .motion-toggle.paused .pause-icon{display:none}
    .animate-in{animation:enter .7s both}
    @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    body.compact .section{padding-top:28px;padding-bottom:37px}
    body.compact .hero{min-height:600px;padding-top:36px;padding-bottom:40px}
    @media(max-width:800px){.stack-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:680px;padding:42px 0 48px}.section{padding:32px 0 44px}}
    @media(max-width:560px){
      .site-header{width:min(calc(100% - 34px),1160px);padding:20px 0}
      .site-nav{gap:12px}
      .site-nav a:not(.nav-outline){display:none}
      .page{width:min(calc(100% - 30px),var(--max))}
      .profile{padding:35px 19px 27px;border-radius:16px}
      .avatar{width:95px;height:95px}
      .profile-line{font-size:12px;line-height:1.8}
      .social{min-height:42px;padding:9px 12px;font-size:11px}
      .focus-grid,.stack-grid,.projects-grid{grid-template-columns:1fr}
      .focus-card{padding:20px}
      .stack{min-height:auto;padding:18px 20px}
      .stack h3{margin-bottom:12px}
      .about-main{padding:26px 21px}
      .about-main h3{font-size:18px}
      .project,.project.featured,.project-inner,.project.featured .project-inner{min-height:315px}
      .project-inner{padding:21px}
      .project .tags{gap:5px}
      .project .tag{font-size:9px;padding:6px 7px}
      .site-footer{flex-direction:column;align-items:flex-start}
      .motion-toggle{bottom:14px;right:14px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <!-- Everything below is automatically built from SITE_CONFIG above. -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <div id="announcement-root"></div>
  <header class="site-header" id="header-root"></header>
  <main class="page" id="main-root"></main>
  <button id="motion-toggle" class="motion-toggle" type="button" hidden aria-label="Pause background animation" title="Pause background animation">
    <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5a1 1 0 0 1 1.52-.85l11 7.5a1 1 0 0 1 0 1.7l-11 7.5A1 1 0 0 1 7 19.5z"/></svg>
  </button>
  <noscript><p style="text-align:center;padding:30px">Enable JavaScript to view this portfolio.</p></noscript>

  <script>
    /* ================================================================
       WEBSITE ENGINE — NO NEED TO EDIT ANYTHING BELOW THIS LINE.
       ================================================================ */
    (() => {
      'use strict';
      const C = SITE_CONFIG;
      const $ = (id) => document.getElementById(id);
      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const bold = (v) => esc(v).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      const safeUrl = (url, fallback = '#') => {
        const s = String(url || '').trim();
        if (s.startsWith('#') && !s.startsWith('##')) return s;
        try { const u = new URL(s, window.location.href); return ['https:', 'http:', 'mailto:'].includes(u.protocol) ? u.href : fallback; }
        catch { return fallback; }
      };
      const ext = (url) => /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '';
      const link = (label, url, cls = '', additional = '') => {
        const href = safeUrl(url);
        return `<a href="${esc(href)}" class="${esc(cls)}"${ext(href)} ${additional}>${esc(label)}</a>`;
      };
      const cssValue = (name, value) => { if (value !== undefined && value !== null && value !== '') document.documentElement.style.setProperty(name, String(value)); };
      const icons = {
        diamond:'<path d="M4 3h16l3 6-11 13L1 9l3-6Zm2.2 2L4 9l8 9.5L20 9l-2.2-4H6.2ZM9 5l3 12 3-12H9Z"/>',
        meta:'<path d="M5.5 6C2.7 6 .8 10.9.8 15.1c0 2.5 1.3 3.9 3.4 3.9 2.4 0 3.8-2.3 6-5.5l1.7-2.4 1.5 2.4c2.2 3.2 3.6 5.5 6 5.5 2.1 0 3.4-1.4 3.4-3.9C22.8 10.9 20.9 6 18 6c-2 0-3.8 1.2-6 4.1C9.7 7.2 7.5 6 5.5 6Zm-1 10.2c-.7 0-1-.6-1-1.6 0-3 1.5-6.1 2.5-6.1 1.1 0 2.4 1.1 4.1 3.4-2.6 3.7-4.2 4.3-5.6 4.3Zm15 0c-1.4 0-3-1.8-5.6-4.3 1.7-2.3 3-3.4 4.1-3.4 1 0 2.5 3.1 2.5 6.1 0 1-.3 1.6-1 1.6Z"/>',
        discord:'<path d="M19.7 5.2a17 17 0 0 0-4.1-1.3l-.5 1a15 15 0 0 0-6.2 0l-.5-1a17 17 0 0 0-4.1 1.3C1.7 9.2.9 13.1 1.3 17c1.7 1.3 3.4 2.1 5.2 2.7l1.1-1.8-1.7-.9.4-.3c3.6 1.7 7.8 1.7 11.4 0l.4.3-1.7.9 1.1 1.8c1.8-.6 3.5-1.4 5.2-2.7.5-4.6-.9-8.5-3-11.8ZM8.6 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.8 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>',
        github:'<path d="M12 2a10 10 0 0 0-3.16 19.49c.5.1.68-.22.68-.48v-1.73c-2.78.6-3.37-1.19-3.37-1.19-.45-1.15-1.1-1.46-1.1-1.46-.91-.62.07-.61.07-.61 1 .07 1.52 1.03 1.52 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.64-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.57 9.57 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.59.69.48A10 10 0 0 0 12 2Z"/>',
        youtube:'<path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.7 12 4.7 12 4.7s-5.9 0-7.6.5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2 12a29 29 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.5 7.6.5 7.6.5s5.9 0 7.6-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 22 12a29 29 0 0 0-.4-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"/>',
        x:'<path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.3-8.5L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/>',
        globe:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15 15 0 0 0-1.2-3.3A8.1 8.1 0 0 1 18.9 8ZM12 4c.8 1.1 1.4 2.4 1.8 4h-3.6c.4-1.6 1-2.9 1.8-4ZM4.3 14a8 8 0 0 1 0-4h4a16 16 0 0 0 0 4h-4Zm.8 2h3.2c.2 1.3.6 2.4 1.2 3.4A8 8 0 0 1 5.1 16Zm3.2-8H5.1a8 8 0 0 1 4.4-3.4A15 15 0 0 0 8.3 8ZM12 20c-.8-1.1-1.4-2.4-1.8-4h3.6c-.4 1.6-1 2.9-1.8 4Zm2.2-6H9.8a13 13 0 0 1 0-4h4.4a13 13 0 0 1 0 4Zm.5 5.4c.5-1 .9-2.1 1.2-3.4h3a8.1 8.1 0 0 1-4.2 3.4ZM16.2 14a16 16 0 0 0 0-4h3.5a8 8 0 0 1 0 4h-3.5Z"/>',
        mail:'<path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm9 8 9-6H3l9 6Zm0 2-9-6v8h18V9l-9 6Z"/>',
        tiktok:'<path d="M16 2c.4 3 2.1 4.7 5 4.9v3.6a9 9 0 0 1-5-1.4v6.1a6.3 6.3 0 1 1-5.7-6.3v3.8a2.5 2.5 0 1 0 2.1 2.5V2H16Z"/>',
        link:'<path d="M10 13a5 5 0 0 0 8 .5l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7 1.4 1.4 1.7-1.7a3 3 0 0 1 4.3 4.3l-3 3A3 3 0 0 1 12 12Zm4-2a5 5 0 0 0-8-.5l-3 3a5 5 0 1 0 7.1 7.1l1.7-1.7-1.4-1.4-1.7 1.7a3 3 0 0 1-4.3-4.3l3-3A3 3 0 0 1 12 12Z"/>'
      };
      const icon = (name) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${icons[name] || icons.link}</svg>`;
      const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
      const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v17m0 0 6-6m-6 6-6-6"/></svg>';
      const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg>';
      const sectionHead = (title, id) => `<div class="section-title"><h2 id="${esc(id)}">${esc(title)}</h2></div>`;
      const tags = (list, dots = false) => `<div class="tags">${(list || []).map(s => `<span class="tag">${dots ? '<span class="tag-dot"></span>' : ''}${esc(s)}</span>`).join('')}</div>`;

      function setTheme() {
        const a = C.appearance || {};
        const co = a.colors || {};
        const map = {
          '--bg':co.background, '--ink':co.text, '--soft':co.secondaryText, '--muted':co.mutedText,
          '--accent':co.accent, '--accent-ink':co.accentText, '--line':co.border,
          '--line-strong':co.borderStrong, '--panel':co.panel, '--panel-highlight':co.panelHighlight
        };
        Object.entries(map).forEach(([k,v]) => cssValue(k,v));
        cssValue('--max', `${Math.max(320,Number(a.maxContentWidth)||980)}px`);
        cssValue('--radius', `${Math.max(0,Number(a.cornerRadius) || 0)}px`);
        cssValue('--blur', `${Math.max(0,Number(a.glassBlur) || 0)}px`);
        cssValue('--body-font', a.bodyFont);
        if (a.customFont?.enabled && a.customFont.fileUrl && a.customFont.name) {
          const face = document.createElement('style');
          const fontName = String(a.customFont.name).replace(/["'\\;{}]/g,'');
          const fontUrl = safeUrl(a.customFont.fileUrl, '');
          if (fontUrl) {
            face.textContent = `@font-face{font-family:"${fontName}";src:url("${fontUrl.replace(/["\\]/g,'')}") format("truetype");font-display:swap;}`;
            document.head.appendChild(face);
            cssValue('--heading-font', `"${fontName}", ${a.fallbackHeadingFont || 'monospace'}`);
          }
        } else cssValue('--heading-font', a.fallbackHeadingFont);
        if (a.spacing === 'compact') document.body.classList.add('compact');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content',co.background || '#080808');
      }

      function setMetadata() {
        const id = C.identity || {};
        document.title = id.browserTitle || id.name || 'Portfolio';
        const meta = (key, value, property = false) => {
          if (!value) return;
          const selector = property ? `meta[property="${key}"]` : `meta[name="${key}"]`;
          let m = document.head.querySelector(selector);
          if (!m) { m = document.createElement('meta'); m.setAttribute(property ? 'property' : 'name',key); document.head.appendChild(m); }
          m.content = value;
        };
        meta('description',id.description);
        meta('og:title',id.browserTitle,true);
        meta('og:description',id.description,true);
        meta('og:image',id.socialPreviewImageUrl,true);
        meta('og:type','website',true);
        meta('twitter:card','summary_large_image');
        meta('twitter:title',id.browserTitle);
        meta('twitter:description',id.description);
        meta('twitter:image',id.socialPreviewImageUrl);
        if (id.faviconUrl) {
          let fav = document.querySelector('link[rel="icon"]');
          if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
          fav.href = safeUrl(id.faviconUrl);
        }
      }

      function renderBackground() {
        const bg = C.background || {};
        const back = $('backdrop');
        $('grain').hidden = !bg.showGrain;
        cssValue('--video-opacity',Math.min(1,Math.max(0,Number(bg.videoOpacity ?? .36))));
        cssValue('--image-opacity',Math.min(1,Math.max(0,Number(bg.imageOpacity ?? .36))));
        cssValue('--overlay-opacity',Math.min(1,Math.max(0,Number(bg.overlayOpacity ?? .43))));
        if (bg.mode === 'image' && bg.imageUrl) {
          const image = document.createElement('img');
          image.src = safeUrl(bg.imageUrl); image.alt = '';
          back.appendChild(image);
        }
        if (bg.mode === 'video' && bg.videoUrl) {
          const video = document.createElement('video');
          video.id = 'bg-video'; video.muted = true; video.loop = true;
          video.playsInline = true; video.preload = 'metadata';
          video.src = safeUrl(bg.videoUrl);
          back.appendChild(video);
          const toggle = $('motion-toggle');
          toggle.hidden = !bg.showMotionToggle;
          const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const shouldAutoplay = !!bg.autoplayVideo && !(bg.pauseVideoForReducedMotion && prefersReducedMotion);
          const syncButton = () => {
            toggle.classList.toggle('paused',video.paused);
            const label = video.paused ? 'Play background animation' : 'Pause background animation';
            toggle.setAttribute('aria-label',label); toggle.title = label;
          };
          video.addEventListener('pause',syncButton);
          video.addEventListener('play',syncButton);
          video.addEventListener('error',() => { toggle.hidden = true; });
          toggle.addEventListener('click',() => {
            if (video.paused) video.play().catch(syncButton);
            else video.pause();
            syncButton();
          });
          if (shouldAutoplay) video.play().catch(syncButton);
          syncButton();
        }
      }

      function renderHeader() {
        const id = C.identity;
        const n = C.navigation || {};
        const a = C.announcement || {};
        if (a.enabled && a.text) {
          $('announcement-root').innerHTML = `<div class="announcement">${a.url ? link(a.text,a.url) : esc(a.text)}</div>`;
        }
        const nav = n.enabled ? `<nav class="site-nav" aria-label="Main navigation">${(n.links || [])
          .map(item => link(item.text, item.href, item.button ? 'nav-outline' : '')).join('')}</nav>` : '';
        $('header-root').innerHTML = `<a class="wordmark" href="#top" aria-label="Back to top">${esc(id.logoFirst)}<span>${esc(id.logoSecond)}</span></a>${nav}`;
      }

      function renderHero() {
        const h = C.hero || {};
        if (!h.enabled) return '';
        const id = C.identity;
        const a = C.appearance || {};
        const badge = id.showPremiumBadge ? `<span class="premium" title="${esc(id.premiumBadgeTooltip)}" aria-label="${esc(id.premiumBadgeTooltip)}">${icon('diamond')}</span>` : '';
        const avatar = id.avatarUrl ? `<img src="${esc(safeUrl(id.avatarUrl))}" alt="${esc(id.name)} profile avatar" data-avatar-image>` : '';
        const buttons = (h.socials || []).filter(s => s.label && s.url).map(s => {
          const href = safeUrl(s.url);
          return `<a class="social${s.primary ? ' primary' : ''}" href="${esc(href)}"${ext(href)}>${icon(s.icon)}<span>${esc(s.label)}</span><span class="external-arrow" aria-hidden="true">↗</span></a>`;
        }).join('');
        const stats = h.showStats && (h.stats||[]).length ? `<div class="stats">${h.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>` : '';
        const scrollTo = C.about?.enabled ? '#about' : C.skills?.enabled ? '#skills' : C.projects?.enabled ? '#projects' : '#footer';
        const scroll = h.showScrollHint ? `<a class="hero-scroll" href="${scrollTo}">${esc(h.scrollHintText || 'Scroll for more')}${down}</a>` : '';
        return `<section class="hero ${a.heroAlignment === 'left' ? 'align-left' : ''}" id="top" aria-labelledby="profile-name">
          <div class="profile ${a.heroStyle === 'minimal' ? 'minimal' : ''} ${a.enableEntranceAnimation ? 'animate-in' : ''}">
            <div class="avatar ${['circle','square'].includes(a.avatarShape) ? a.avatarShape : ''}">${esc(id.avatarFallback || (id.name||'M')[0])}${avatar}</div>
            <h1 id="profile-name">${esc(h.headline || id.name)} ${badge}</h1>
            ${h.subtitle !== '' ? `<div class="handle">${esc(h.subtitle || id.handle)}</div>` : ''}
            ${h.statusLine ? `<p class="profile-line">${esc(h.statusLine)}</p>` : ''}
            ${h.showLocation && id.location ? `<div class="location">${pin}${esc(id.location)}</div>` : ''}
            ${stats}
            ${buttons ? `<div class="profile-divider"></div><div class="socials" aria-label="Profile links">${buttons}</div>` : ''}
          </div>${scroll}
        </section>`;
      }

      function renderAbout() {
        const a = C.about || {};
        if (!a.enabled) return '';
        const paragraphs = (a.paragraphs || []).map(p => `<p>${bold(p)}</p>`).join('');
        const focus = a.showFocusCards && (a.focusCards || []).length ? `<div class="focus-grid">${a.focusCards.map(f => `<article class="panel focus-card"><h3>${esc(f.title)}</h3><p>${esc(f.description)}</p></article>`).join('')}</div>` : '';
        return `<section class="section" id="about" aria-labelledby="about-heading">
          ${sectionHead(a.title || 'About','about-heading')}
          <article class="panel about-main">
            ${a.eyebrow ? `<span class="eyebrow">${esc(a.eyebrow)}</span>` : ''}
            ${a.heading ? `<h3>${esc(a.heading)}</h3>` : ''}
            ${paragraphs}
            ${a.showTags ? tags(a.tags,true) : ''}
          </article>${focus}
        </section>`;
      }

      function renderSkills() {
        const s = C.skills || {};
        if (!s.enabled) return '';
        const cols = Math.min(4,Math.max(1,parseInt(s.columns,10)||4));
        return `<section class="section" id="skills" aria-labelledby="skills-heading">
          ${sectionHead(s.title || 'Skills & Stack','skills-heading')}
          <div class="stack-grid" style="--stack-cols:${cols}">
            ${(s.groups || []).map(g => `<article class="panel stack"><h3>${esc(g.title)}</h3>${tags(g.items)}</article>`).join('')}
          </div>
        </section>`;
      }

      function renderProjects() {
        const p = C.projects || {};
        if (!p.enabled) return '';
        const items = (p.items || []).map(item => {
          const href = safeUrl(item.url);
          return `<a class="project ${item.featured ? 'featured' : ''}" href="${esc(href)}"${ext(href)} aria-label="${esc(item.title)} — open project">
            ${item.imageUrl ? `<img class="project-cover" src="${esc(safeUrl(item.imageUrl))}" alt="" loading="lazy" data-project-cover>` : ''}
            ${item.watermark ? `<div class="project-watermark" aria-hidden="true">${esc(item.watermark)}</div>` : ''}
            <div class="project-inner">${tags(item.tags)}<div class="project-bottom">
              <div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p></div>
              <div class="project-arrow" aria-hidden="true">${arrow}</div>
            </div></div>
          </a>`;
        }).join('');
        return `<section class="section" id="projects" aria-labelledby="projects-heading">
          ${sectionHead(p.title || 'Projects','projects-heading')}
          <div class="projects-grid">${items}</div>
        </section>`;
      }

      function renderFooter() {
        const f = C.footer || {};
        if (!f.enabled) return '';
        const year = f.showYear ? `© ${new Date().getFullYear()} ` : '© ';
        const links = (f.links || []).map(item => link(item.text,item.href)).join('');
        const back = f.showBackToTop ? `<a href="#top">Back to top ↑</a>` : '';
        return `<footer id="footer" class="site-footer"><div>${year}${esc(f.copyrightName || C.identity.company)}. ${esc(f.trailingText || '')}</div><div class="footer-right">${links}${back}</div></footer>`;
      }

      setTheme();
      setMetadata();
      renderBackground();
      renderHeader();
      $('main-root').innerHTML = renderHero() + renderAbout() + renderSkills() + renderProjects() + renderFooter();
      document.querySelectorAll('[data-avatar-image], [data-project-cover]').forEach(img => {
        img.addEventListener('error', () => { img.style.display = 'none'; });
      });
    })();
  </script>
</body>
</html>
